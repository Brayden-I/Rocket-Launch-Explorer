<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Launch Explorer</title>
    
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="container py-4">
    <h1 class="text-center mb-4">Rocket Launch Explorer</h1>

    <div id="launchCarousel" class="carousel slide"
         style="--bs-carousel-items-peek: 3rem; --bs-carousel-items-gap: 1rem;">

        <!-- app.js builds the slides and indicator dots from the API data -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <h3 class="h5 text-center mb-2">Launch 1</h3>
                <div class="bg-secondary text-white rounded-5 d-flex align-items-center justify-content-center" style="height: 240px;">rocket image here</div>
            </div>
        </div>

        <div class="carousel-indicators"></div>

        <!-- Inside .carousel on purpose: the icon sizes are CSS variables defined on .carousel -->
        <div class="d-flex justify-content-center gap-2 mt-3">
            <button class="btn-icon btn-sm" type="button" data-bs-target="#launchCarousel" data-bs-slide="prev">
                <span class="carousel-icon-prev" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="btn-icon btn-sm" type="button" data-bs-target="#launchCarousel" data-bs-slide="next">
                <span class="carousel-icon-next" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>

    <div class="row justify-content-center mt-4">
        <div class="col-12 col-sm-8 col-md-6">
            <label for="daySelector" class="form-label">Filter by launch day</label>
            <div class="input-group">
                <input type="date" id="daySelector" class="form-control">
                <button type="button" id="clearDay" class="btn btn-outline-secondary">All days</button>
            </div>
            <p id="dayMessage" class="form-text"></p>
        </div>
    </div>

    <!-- Used in Part 2 for loading and error messages -->
    <p id="status" class="text-center"></p>

    <div id="missionDetails" class="mt-2"></div>
</main>

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
<!-- type="module" lets app.js import Bootstrap's Carousel (Bootstrap 6 has no global "bootstrap" object) -->
<script type="module" src="./js/app.js"></script>
</body>
</html>
