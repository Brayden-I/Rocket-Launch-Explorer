<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Launch Explorer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous"></head>
<body>

<div id="launchCarousel" class="carousel slide"
     style="--bs-carousel-items-peek: 3rem; --bs-carousel-items-gap: 1rem;">

    <div class="carousel-inner">
        <div class="carousel-item active">
            <h3 class="h5 text-center mb-2">Launch 1</h3>
            <div class="bg-secondary text-white rounded-5 d-flex align-items-center justify-content-center" style="height: 240px;">rocket image here</div>
        </div>
    </div>

    <div class="carousel-indicators">
        <button type="button" data-bs-target="#launchCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Launch 1"></button>
        <button type="button" data-bs-target="#launchCarousel" data-bs-slide-to="1" aria-label="Launch 2"></button>
        <button type="button" data-bs-target="#launchCarousel" data-bs-slide-to="2" aria-label="Launch 3"></button>
    </div>
</div>

<div class="d-flex justify-content-center gap-2 mt-3">
    <button class="btn-icon btn-sm" type="button" data-bs-target="#launchCarousel" data-bs-slide="prev">
        <span class="carousel-icon-prev" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="btn-icon btn-sm" type="button" data-bs-target="#launchCarousel" data-bs-slide="next">
        <span class="carousel-icon-next" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>

<div class="row justify-content-center mt-4">
    <div class="col-12 col-sm-8 col-md-6">
        <label for="daySelector" class="form-label">Filter by launch day</label>
        <div class="input-group">
            <input type="date" id="daySelector" class="form-control">
            <button type="button" id="clearDay" class="btn btn-outline-secondary">All days</button>
        </div>
        <p id="dayMessage" class="form-text"></p>
    </div>
</div>

<div class="mt-4">
    <p id="launchDescription">Description for launch 1 goes here.</p>
</div>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
